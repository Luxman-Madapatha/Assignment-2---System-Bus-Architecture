<svg width="1300" height="760" viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .label { font: 700 20px Arial, sans-serif; fill: #111827; }
      .small { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; }
      .box2 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .box3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .box4 { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; }
      .line { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="650" y="42" text-anchor="middle" class="title">Control FSM / State View</text>

  <!-- states -->
  <rect x="120" y="120" width="200" height="120" rx="12" class="box"/>
  <text x="220" y="155" text-anchor="middle" class="label">IDLE</text>
  <text x="220" y="185" text-anchor="middle" class="small">no active request</text>
  <text x="220" y="210" text-anchor="middle" class="small">gnt = 00</text>

  <rect x="420" y="120" width="220" height="120" rx="12" class="box2"/>
  <text x="530" y="155" text-anchor="middle" class="label">ARBITRATE</text>
  <text x="530" y="185" text-anchor="middle" class="small">choose master</text>
  <text x="530" y="210" text-anchor="middle" class="small">M0 priority / M1 fallback</text>

  <rect x="760" y="120" width="220" height="120" rx="12" class="box3"/>
  <text x="870" y="155" text-anchor="middle" class="label">ACTIVE</text>
  <text x="870" y="185" text-anchor="middle" class="small">granted bus in use</text>
  <text x="870" y="210" text-anchor="middle" class="small">bus request accepted</text>

  <rect x="470" y="340" width="260" height="120" rx="12" class="box4"/>
  <text x="600" y="375" text-anchor="middle" class="label">ACK / RELEASE</text>
  <text x="600" y="405" text-anchor="middle" class="small">slave asserts ack</text>
  <text x="600" y="435" text-anchor="middle" class="small">gnt cleared after transfer</text>

  <!-- arrows -->
  <path d="M320 180 L420 180" class="line"/>
  <path d="M640 180 L760 180" class="line"/>
  <path d="M870 240 L870 360 L730 360" class="line"/>
  <path d="M470 400 L320 400 L320 220" class="line"/>

  <!-- invalid address path -->
  <rect x="100" y="540" width="1080" height="120" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="650" y="578" text-anchor="middle" class="label">Error Path</text>
  <text x="650" y="610" text-anchor="middle" class="small">If no slave matches address: unmapped = 1, err = 1, ack = 1, and the transfer ends with an error</text>
  <text x="650" y="640" text-anchor="middle" class="small">This prevents invalid memory access and keeps the bus protocol safe</text>

</svg>
