<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a3f5f"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .section { font: 700 22px Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 500 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #eef6ff; stroke: #2a5d9f; stroke-width: 2; }
      .box2 { fill: #f0fdf4; stroke: #2f8f5b; stroke-width: 2; }
      .box3 { fill: #fff7ed; stroke: #c76a00; stroke-width: 2; }
      .box4 { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; }
      .line { stroke: #2a3f5f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">Address Map / Slave Decoder</text>

  <!-- Memory blocks -->
  <rect x="120" y="110" width="260" height="130" rx="12" class="box2"/>
  <text x="250" y="150" text-anchor="middle" class="section">Slave 0</text>
  <text x="250" y="185" text-anchor="middle" class="small">0x0000 - 0x0FFF</text>
  <text x="250" y="210" text-anchor="middle" class="small">4 KB</text>

  <rect x="470" y="110" width="260" height="130" rx="12" class="box2"/>
  <text x="600" y="150" text-anchor="middle" class="section">Slave 1</text>
  <text x="600" y="185" text-anchor="middle" class="small">0x1000 - 0x1FFF</text>
  <text x="600" y="210" text-anchor="middle" class="small">4 KB</text>

  <rect x="820" y="110" width="260" height="130" rx="12" class="box2"/>
  <text x="950" y="150" text-anchor="middle" class="section">Slave 2</text>
  <text x="950" y="185" text-anchor="middle" class="small">0x2000 - 0x27FF</text>
  <text x="950" y="210" text-anchor="middle" class="small">2 KB</text>

  <!-- Decoder -->
  <rect x="440" y="320" width="320" height="220" rx="12" class="box"/>
  <text x="600" y="360" text-anchor="middle" class="section">Address Decoder</text>
  <text x="600" y="395" text-anchor="middle" class="small">a[13:12] == 00 → Slave 0</text>
  <text x="600" y="425" text-anchor="middle" class="small">a[13:12] == 01 → Slave 1</text>
  <text x="600" y="455" text-anchor="middle" class="small">a[13:11] == 100 → Slave 2</text>
  <text x="600" y="485" text-anchor="middle" class="small">otherwise → unmapped</text>
  <text x="600" y="515" text-anchor="middle" class="small">err = 1, ack = 1</text>

  <!-- Unmapped -->
  <rect x="790" y="420" width="270" height="120" rx="12" class="box4"/>
  <text x="925" y="460" text-anchor="middle" class="section">Unmapped Range</text>
  <text x="925" y="500" text-anchor="middle" class="small">Anything outside</text>
  <text x="925" y="525" text-anchor="middle" class="small">0x0000 - 0x27FF</text>

  <!-- Arrows -->
  <path d="M380 175 L470 175" class="line"/>
  <path d="M730 175 L820 175" class="line"/>

  <path d="M600 240 L600 320" class="line"/>
  <path d="M760 440 L790 440" class="line"/>

  <!-- Address map bands -->
  <rect x="120" y="580" width="1020" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="140" y="618" class="label">Address Map:</text>
  <text x="320" y="618" class="small">0x0000-0x0FFF</text>
  <text x="520" y="618" class="small">0x1000-0x1FFF</text>
  <text x="720" y="618" class="small">0x2000-0x27FF</text>
  <text x="920" y="618" class="small">others</text>
  <text x="1000" y="618" class="small">→ error</text>

</svg>
